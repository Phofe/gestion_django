name: Academic Django checks
on:
  push:
    paths:
      - "systeme-gestion-academique/**"
      - ".github/workflows/academic-django.yml"
  pull_request:
    paths:
      - "systeme-gestion-academique/**"
      - ".github/workflows/academic-django.yml"
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: academic_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d academic_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DJANGO_SECRET_KEY: ci-test-secret
      DJANGO_DEBUG: "False"
      DB_NAME: academic_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
    defaults:
      run:
        working-directory: systeme-gestion-academique
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: systeme-gestion-academique/requirements.txt
      - run: pip install -r requirements.txt
      - run: python manage.py check
      - run: python manage.py makemigrations academic
      - run: python manage.py migrate --noinput
      - run: python manage.py test
