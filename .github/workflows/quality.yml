name: Vérifications des projets

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  analyse-csv:
    name: Tests Python — analyse CSV
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Exécuter les tests unitaires
        working-directory: assistant-analyse-csv
        run: python -m unittest -v
      - name: Vérifier l'exemple CSV
        working-directory: assistant-analyse-csv
        run: python analyse_csv.py exemple.csv --json

  api-rest:
    name: Tests Node.js — API REST
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Installer les dépendances
        working-directory: api-rest-produits
        run: npm install --no-audit --no-fund
      - name: Exécuter les tests CRUD
        working-directory: api-rest-produits
        run: npm test
