<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Connexion — CampusPilot</title><style>body{font:16px system-ui;background:#f5f2eb;display:grid;place-items:center;min-height:100vh;margin:0;color:#202923}.box{width:min(420px,calc(100% - 32px));background:white;padding:30px;border-radius:18px;border:1px solid #ddd}.box h1{margin-top:0;color:#315b45}label{display:block;margin:16px 0 6px}input{width:100%;padding:12px;border:1px solid #ccc;border-radius:8px}.button{width:100%;margin-top:20px;padding:12px;background:#315b45;color:white;border:0;border-radius:8px;font-weight:bold}</style></head><body><form class="box" method="post">{% csrf_token %}<h1>CampusPilot</h1><p>Connectez-vous à votre espace académique.</p>{% if form.errors %}<p role="alert">Identifiants invalides. Réessayez.</p>{% endif %}<label for="id_username">Nom d'utilisateur</label>{{ form.username }}<label for="id_password">Mot de passe</label>{{ form.password }}<input type="hidden" name="next" value="{{ next }}"><button class="button" type="submit">Se connecter</button></form></body></html>
